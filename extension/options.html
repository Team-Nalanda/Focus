<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow AI - Options</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            800: '#1e293b',
                            900: '#0f172a',
                        },
                        violet: {
                            500: '#8b5cf6',
                            600: '#7c3aed',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="glass max-w-md w-full rounded-2xl p-8 space-y-6">
        <h1 class="text-2xl font-bold text-center text-violet-500">FocusFlow AI Settings</h1>
        
        <form id="settingsForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1" for="apiKey">Gemini API Key</label>
                <input type="password" id="apiKey" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="AIzaSy..." required>
            </div>
            
            <div>
                <label class="block text-sm font-medium mb-1" for="firebaseConfig">Firebase Config (JSON)</label>
                <textarea id="firebaseConfig" rows="8" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white font-mono text-xs focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder='{"apiKey": "...", "authDomain": "...", "projectId": "...", "storageBucket": "...", "messagingSenderId": "...", "appId": "..."}' required></textarea>
                <p class="text-xs text-slate-400 mt-2">Paste your Firebase web app config JSON configuration here.</p>
            </div>

            <button type="submit" class="w-full bg-violet-600 hover:bg-violet-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200">
                Save Configurations
            </button>
        </form>

        <div id="statusMessage" class="hidden text-center text-sm font-medium p-3 rounded-lg"></div>
    </div>
    <script src="options.js"></script>
</body>
</html>
