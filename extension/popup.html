<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow AI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand">
            <span class="brand-name">FOCUS<span class="brand-dot">.</span></span>
        </div>
        <div id="statusBadge" class="status-badge idle">
            <span class="status-dot"></span>
            <span id="statusText">Idle</span>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="focus">Focus</button>
        <button class="nav-tab" data-tab="settings">Settings</button>
    </div>

    <!-- ═══ FOCUS TAB ═══ -->

    <!-- Home View (inside Focus tab) -->
    <div id="homeView" class="view active fade-in" data-tab-content="focus">

        <!-- Task Input -->
        <div class="card">
            <div class="section-label">What are you working on?</div>
            <textarea id="taskInput" rows="2" class="input-field" placeholder="e.g., Studying Quantum Physics..."></textarea>
        </div>

        <!-- Timer Duration -->
        <div class="card">
            <div class="section-label">Session Duration</div>
            <label style="display:flex; align-items:center; gap:8px; margin-bottom:10px; cursor:pointer; font-size:12px; color:var(--text-muted);">
                <input type="checkbox" id="aiDecideTime" style="accent-color: var(--accent); width:14px; height:14px;">
                <span>Let AI decide the optimal time</span>
            </label>
            <div id="timePickerContainer" class="time-picker">
                <div class="time-unit">
                    <label>Hours</label>
                    <input type="number" id="hoursInput" value="0" min="0" max="12">
                </div>
                <div class="time-unit">
                    <label>Minutes</label>
                    <input type="number" id="minutesInput" value="25" min="0" max="59">
                </div>
            </div>
        </div>

        <!-- Start Button -->
        <button id="startSessionBtn" class="btn btn-primary w-full" style="padding: 12px; font-size: 14px;">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Start Focus Session
        </button>
    </div>

    <!-- Session View (inside Focus tab) -->
    <div id="sessionView" class="view fade-in" data-tab-content="focus">

        <!-- Timer at the top -->
        <div class="card" style="text-align: center; padding: 20px;">
            <div class="timer-wrapper">
                <svg class="timer-svg" viewBox="0 0 160 160">
                    <circle cx="80" cy="80" r="74" class="timer-bg" stroke-width="5" fill="none" />
                    <circle id="timerProgressCircle" cx="80" cy="80" r="74" stroke="var(--accent)" class="timer-fg" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="0" />
                </svg>
                <div id="countdownDisplay" class="timer-display">25:00</div>
            </div>

            <!-- Controls right under timer -->
            <div class="session-controls">
                <button id="pauseBtn" class="control-btn" aria-label="Pause">
                    <span id="pauseIconContainer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </span>
                </button>
                <button id="finishBtn" class="control-btn stop" aria-label="Stop">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon-lg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></svg>
                </button>
            </div>
        </div>

        <!-- Task Info below -->
        <div class="card">
            <div class="section-label">Active Goal</div>
            <p id="activeTaskDisplay" class="session-task">...</p>
            <p id="aiTipDisplay" class="session-tip"></p>
        </div>
    </div>

    <!-- ═══ SETTINGS TAB ═══ -->
    <div id="settingsView" class="view fade-in" data-tab-content="settings">
        <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
            <div class="section-label">API Configuration</div>

            <div class="setting-group">
                <label for="apiKeyInput">Gemini API Key</label>
                <input type="password" id="apiKeyInput" class="input-field" placeholder="AIzaSy...">
            </div>

            <div class="setting-group">
                <label for="firebaseConfigInput">Firebase Config (JSON)</label>
                <textarea id="firebaseConfigInput" rows="6" class="input-field" placeholder='{ "apiKey": "...", "projectId": "..." }'></textarea>
            </div>

            <button id="saveSettingsBtn" class="btn btn-primary w-full">Save Settings</button>
            <div id="settingsStatus" class="hidden status-msg"></div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="hidden overlay">
        <svg xmlns="http://www.w3.org/2000/svg" class="spin" style="width:28px;height:28px;color:var(--accent);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    </div>

    <script type="module" src="popup.js"></script>
</body>
</html>
